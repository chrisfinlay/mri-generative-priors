[workspace]
name = "mri-generative-priors"
version = "0.1.0"
description = "Generative priors for accelerated MRI reconstruction with uncertainty"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tasks]
test = "pytest -q"
lint = "ruff check ."
slice = "python scripts/smoke_slice.py"
milestones = "python scripts/milestone_badge.py"
lab = "jupyter lab"
check = "python -m mrigen.setup_check"
download = "python data/download_subset.py"
preprocess = "python data/preprocess.py"

[dependencies]
python = ">=3.11,<3.13"
numpy = "*"
h5py = "*"
matplotlib = "*"
scikit-image = "*"
jupyterlab = "*"
pytest = "*"
ruff = "*"
ipywidgets = ">=8.1.9,<9"
jax = ">=0.4.34"
equinox = "*"
optax = "*"
numpyro = "*"

[pypi-dependencies]
# Everything comes from conda-forge except mrigen itself: editable path
# installs only exist in the pip world.
mrigen = { path = ".", editable = true }

# GPU environment: `pixi run -e gpu <task>` on a machine with an NVIDIA GPU
# (linux only). Pulls the CUDA build of jaxlib from conda-forge.
[feature.gpu]
platforms = ["linux-64"]

[feature.gpu.system-requirements]
cuda = "12"

[feature.gpu.dependencies]
jaxlib = { version = "*", build = "*cuda12*" }
# cuDNN 9.11 dropped Maxwell/Pascal/Volta GPUs; 9.10 still supports every
# architecture through Blackwell (see issue #5).
cudnn = "<9.11"

[environments]
gpu = ["gpu"]
